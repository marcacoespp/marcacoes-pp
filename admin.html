<!DOCTYPE html>
<html lang="pt-PT">
<head>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
  :root{
    --bg:#0E1116; --bg2:#12161D; --card:#151A22; --line:#252C39; --line2:#2F3745;
    --ink:#F1F3F7; --muted:#8A93A3; --accent:#2F5BD3; --accent2:#4A74EE;
    --danger:#E5484D; --confirm:#1F9D6B; --brass:#4A74EE; --oxblood:#6C93FF; --sage:#222B3D; --green-dark:#F1F3F7; --green:#2F5BD3;
    --radius:12px; color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Archivo Black',sans-serif;font-weight:900;text-transform:uppercase;margin:0;color:var(--ink);}
  .app{max-width:760px;margin:0 auto;padding:0 20px 60px;}
  .header{padding:30px 0 0;}
  .brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .brand{font-family:'Archivo Black',sans-serif;font-size:30px;text-transform:uppercase;color:#fff;letter-spacing:.01em;line-height:1;}
  .brand span{color:var(--accent);}
  .tagline{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:8px;}
  .stripe{height:1px;margin:22px 0 26px;background:var(--line);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:16px;}
  .section-title{font-family:'Archivo Black',sans-serif;font-size:15px;color:var(--ink);text-transform:uppercase;letter-spacing:.04em;margin-bottom:14px;}

  .daylist{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#2F3745 transparent;}
  .daychip{flex:0 0 auto;border:1.5px solid var(--line2);background:var(--bg2);border-radius:10px;padding:10px 14px;cursor:pointer;text-align:center;min-width:64px;}
  .daychip .dow{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;}
  .daychip .dnum{font-family:'Archivo Black',sans-serif;font-size:20px;margin-top:2px;}
  .daychip:hover{border-color:var(--accent2);}
  .daychip.selected{background:var(--accent);border-color:var(--accent);}
  .daychip.selected .dow{color:#DCE5FF;}

  .slotgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .slot{border:1.5px solid var(--line2);background:var(--bg2);border-radius:8px;padding:9px 14px;font-size:14.5px;cursor:pointer;font-weight:600;}
  .slot:hover{border-color:var(--accent2);}
  .slot.selected{background:var(--accent);border-color:var(--accent);color:#fff;}
  .empty-note{color:var(--muted);font-size:14.5px;padding:6px 0;}

  label{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#AEB7C6;margin:16px 0 7px;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=email],input[type=tel],input[type=date],input[type=time],textarea,input[type=number],select{
    width:100%;border:1.5px solid var(--line2);border-radius:8px;padding:11px 13px;font-family:'Inter',sans-serif;font-size:15px;color:var(--ink);background:var(--bg);}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--accent2);outline-offset:1px;border-color:var(--accent2);}
  textarea{resize:vertical;min-height:60px;}
  input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;border-radius:8px;padding:13px 22px;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:background .15s,filter .15s,transform .05s;}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent2);}
  .btn-primary:disabled,.btn-confirm:disabled{background:#2A3350;color:#7A86A5;cursor:not-allowed;}
  .btn-confirm{background:var(--confirm);color:#fff;}
  .btn-reject{background:transparent;border-color:var(--danger);color:#FF8A8E;}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--line2);}
  .btn-ghost:hover{border-color:#fff;}
  .btn-sm{padding:9px 14px;font-size:12px;}

  .req{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px;background:var(--bg2);}
  .req .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .req .who{font-weight:700;color:var(--ink);}
  .req .when{font-weight:700;color:var(--accent2);}
  .req .meta{font-size:13.5px;color:var(--muted);margin-top:4px;}
  .req .note{font-size:13.5px;color:#6B5D4C;margin-top:6px;font-style:italic;}
  .req .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}

  .pill{font-size:11.5px;padding:2px 8px;border-radius:20px;font-weight:700;}
  .pill.blocked{background:var(--sage);color:var(--ink);}

  .passgate{text-align:center;padding:20px 0;}
  .passgate input{max-width:180px;margin:14px auto;text-align:center;letter-spacing:3px;font-size:18px;}
  .error-text{color:#FF8A8E;font-size:13.5px;margin-top:6px;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:480px){.grid2{grid-template-columns:1fr;}}

  .footer-note{color:#5D6678;font-size:12.5px;text-align:center;margin-top:30px;}
  .daysel{display:flex;gap:6px;flex-wrap:wrap;}
  .daytoggle{border:1.5px solid var(--line2);background:var(--bg2);border-radius:6px;padding:7px 11px;font-size:13px;cursor:pointer;font-weight:700;color:#AEB7C6;}
  .daytoggle.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .link-btn{background:none;border:none;color:var(--oxblood);font-size:13.5px;font-weight:600;cursor:pointer;padding:0;text-decoration:underline;}
  .loading{color:var(--muted);font-size:14.5px;padding:40px 0;text-align:center;}

  .svcrow{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .svcrow input[type=text]{flex:2;}
  .svcrow input[type=number]{flex:1;}
  .svcrow .rm{background:none;border:none;color:#FF8A8E;font-size:13px;cursor:pointer;font-weight:700;white-space:nowrap;}
  .add-svc{color:var(--oxblood);}

  .blockeddate-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .blockeddate-row:last-child{border-bottom:none;}
  .blockeddate-row .rm{background:none;border:none;color:#FF8A8E;font-size:13px;cursor:pointer;font-weight:700;}

  /* ============ TEMA A — FLASH CLÁSSICO (claro) ============ */
  :root{
    --bg:#F0E4CB; --bg2:#FBF4E3; --card:#FBF4E3; --line:#1D1510; --line2:#1D1510;
    --ink:#1D1510; --muted:#6B5D4C; --accent:#D2382B; --accent2:#1F7A74;
    --danger:#B3261E; --confirm:#1F7A74; --brass:#E8A92A; --oxblood:#1F7A74; --sage:#E8A92A; --green-dark:#1D1510; --green:#D2382B;
    --mus:#E8A92A; --teal:#1F7A74; --red:#D2382B; color-scheme:light;
  }
  body{background:var(--bg) radial-gradient(rgba(29,21,16,.07) 1px,transparent 1.2px) 0 0/14px 14px;color:var(--ink);}
  h1,h2,h3{font-family:'Alfa Slab One',serif;font-weight:400;}
  .brand{font-family:'Alfa Slab One',serif;font-size:36px;color:var(--red);-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink);}
  .brand span{color:var(--ink);-webkit-text-stroke:0;text-shadow:none;font-family:'UnifrakturCook',serif;font-weight:700;text-transform:none;font-size:1.05em;}
  .tagline{color:var(--teal);font-weight:800;}
  .stripe{height:6px;background:repeating-linear-gradient(90deg,var(--ink) 0 14px,transparent 14px 22px);}
  .card{border:3px solid var(--ink);border-radius:8px;box-shadow:6px 6px 0 var(--ink);}
  .section-title{display:inline-block;font-family:'Alfa Slab One',serif;font-size:15px;letter-spacing:.06em;background:var(--mus);border:3px solid var(--ink);padding:6px 16px;box-shadow:3px 3px 0 var(--ink);margin-bottom:18px;}
  .daychip,.slot,.daytoggle{background:var(--card);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);color:var(--ink);}
  .daychip:hover,.slot:hover{border-color:var(--ink);background:var(--mus);}
  .daychip.selected,.slot.selected,.daytoggle.on{background:var(--red);border-color:var(--ink);color:var(--card);}
  .daychip.selected .dow{color:#FBE3DE;}
  .daylist,.dayrow{scrollbar-color:var(--ink) transparent;}
  label{color:var(--ink);}
  input[type=text],input[type=email],input[type=tel],input[type=date],input[type=time],textarea,input[type=number],select{background:#fff;border:2px solid var(--ink);color:var(--ink);}
  input:focus,textarea:focus,select:focus{outline:3px solid var(--mus);border-color:var(--ink);}
  input[type=checkbox]{accent-color:var(--red);}
  .btn{border:3px solid var(--ink);border-radius:6px;box-shadow:3px 3px 0 var(--ink);font-weight:800;transition:transform .08s,box-shadow .08s;}
  .btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);}
  .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
  .btn-primary{background:var(--red);color:var(--card);}
  .btn-primary:hover{background:var(--red);}
  .btn-primary:disabled,.btn-confirm:disabled{background:#D9CDB3;color:#8C7F6A;box-shadow:none;transform:none;}
  .btn-confirm{background:var(--teal);color:var(--card);}
  .btn-reject{background:var(--card);border-color:var(--ink);color:var(--danger);}
  .btn-ghost{background:var(--mus);color:var(--ink);border-color:var(--ink);}
  .btn-ghost:hover{border-color:var(--ink);}
  .req{background:#fff;border:2px solid var(--ink);border-radius:8px;box-shadow:3px 3px 0 var(--ink);}
  .req .when{color:var(--red);}
  .req .meta{color:var(--muted);} .req .note{color:var(--muted);}
  .pill.blocked{background:var(--mus);color:var(--ink);border:2px solid var(--ink);}
  .error-text{color:var(--danger);font-weight:600;}
  .link-btn{color:var(--teal);}
  .footer-note{color:var(--muted);}
  .blockeddate-row{border-bottom:2px dashed rgba(29,21,16,.3);}
  .svcrow .rm,.blockeddate-row .rm{color:var(--danger);}
  .add-svc{color:var(--teal);}
  ::placeholder{color:#A09480;}
</style>
</head>
<body>
<div id="root" class="app"><div class="loading">A preparar a agenda…</div></div>

<script>
const DOW = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MONTHS = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

const DEFAULT_SERVICES = [
  {id:'corte', name:'Cabelo', minutes:50, price:15},
  {id:'corte_barba', name:'Cabelo + Barba', minutes:70, price:20},
  {id:'barba', name:'Barba', minutes:25, price:8}
];

const DEFAULT_PRICES = {corte:15, corte_barba:20, barba:8};
function withDefaultPrices(list){ return (list||[]).map(function(s){ var p=Number(s.price)||0; return p>0 ? s : Object.assign({}, s, {price: DEFAULT_PRICES[s.id]||0}); }); }

const DEFAULT_CONFIG = {
  barbershopName: 'PP Marcações',
  address: '',
  phone: '',
  instagramUrl: 'https://www.instagram.com/pepzzzzzzz/',
  barberEmail: '',
  workDays: [2,3,4,5,6], // 0=domingo, 1=segunda, 2=terça...
  locationsByDay: {2:'Marinha Grande', 3:'Leiria', 4:'Leiria', 5:'Marinha Grande', 6:'Leiria'},
  startHour: 9,
  endHour: 19,
  slotStepMinutes: 15,
  leadMinutes: 60,
  passcode: '1234',
  services: DEFAULT_SERVICES,
  blockedDates: []
};

// ===== FIREBASE =====
// Usa aqui o MESMO firebaseConfig que colocaste no index.html — ambos os ficheiros
// têm de apontar ao mesmo projeto Firebase para partilharem os dados.
const firebaseConfig = {
  apiKey: "AIzaSyB2MVvXo7LlhFa4e8twBCqr0gGb0zXH2JY",
  authDomain: "marcacoes-pp.firebaseapp.com",
  projectId: "marcacoes-pp",
  storageBucket: "marcacoes-pp.firebasestorage.app",
  messagingSenderId: "1061204569418",
  appId: "1:1061204569418:web:266e70c26f52327b40e5b3"
};
let fsDb = null;
let configRef = null;
let bookingsRef = null;
let bookingsLoaded = false;
let configLoaded = false;
let firebaseUnavailable = false;

// ===== EMAILJS (envio automático de emails) =====
// Usa aqui os MESMOS valores que colocaste no index.html.
const EMAILJS_PUBLIC_KEY = 'ZQKdCEaz_4oOX36RI';
const EMAILJS_SERVICE_ID = 'service_5k8lt6p';
const EMAILJS_CLIENT_TEMPLATE_ID = 'template_ye36iii';
let emailjsReady = false;

let data = null; // {config, bookings:[], blockedDates:[]}
let barberUnlocked = false;
let passInput = '';
let passError = false;
let showConfig = false;

// vacation / block state
let vacStart = '';
let vacEnd = '';
let blockRangeStart = '';
let blockRangeEnd = '';
let blockTimeFrom = '';
let blockTimeTo = '';
let lastEmail = null;
let uiMessage = null;
let confirmingCancelId = null;

// reschedule state
let editingBookingId = null;
let editDate = null;
let editTime = null;

// fecho do dia
let fechos = [];            // documentos barbearia_fechos
let closeDate = '';          // YYYY-MM-DD (por omissão hoje)
let closeRows = {};          // bookingId -> {attended, price}
let closeExtras = [];        // [{serviceName, price}] sem marcação
let closeEditing = false;    // a editar um fecho já feito
let closeInit = '';          // data para a qual closeRows foi inicializado
let showClosing = false;
let repPreset = 'month';   // today | week | last7 | month | lastmonth | custom
let repFrom = '';
let cmpMetric = 'total';   // total | count
let cmpMonths = 6;         // 6 | 12
let repTo = '';
let fechosRef = null;

const root = document.getElementById('root');

function pad(n){return n<10?'0'+n:''+n;}
function dateKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtDateLong(key){
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(y,m-1,d);
  return DOW[dt.getDay()]+', '+d+' '+MONTHS[m-1];
}
function timeStr(h,m){return pad(h)+':'+pad(m);}
function formatDuration(mins){
  if(mins>60){
    const h = Math.floor(mins/60), m = mins%60;
    return h+':'+pad(m)+'h';
  }
  return mins+' min';
}
function minutesFromTime(t){const [h,m]=t.split(':').map(Number); return h*60+m;}
function money(n){ return '€'+(Number(n)||0).toFixed(2).replace('.',','); }
function newToken(){
  const a = new Uint8Array(12);
  (window.crypto||window.msCrypto).getRandomValues(a);
  return Array.from(a).map(x=>x.toString(36).padStart(2,'0')).join('').slice(0,20);
}
function clientSiteBase(){ return new URL('./', location.href).href; }
function manageUrlFor(token){ return clientSiteBase() + 'index.html?m=' + token; }
async function ensureToken(b){
  if(b.token) return b.token;
  const t = newToken();
  try{ await bookingsRef.doc(b.id).update({token:t}); b.token = t; }catch(e){ console.error('token failed', e); return ''; }
  return t;
}
function esc(s){return (s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
function overlaps(aStart,aDur,bStart,bDur){ return aStart < bStart+bDur && bStart < aStart+aDur; }

function initFirebase(){
  try{
    firebase.initializeApp(firebaseConfig);
    fsDb = firebase.firestore();
  }catch(e){
    console.error('Firebase init failed', e);
    firebaseUnavailable = true;
    render();
    return;
  }
  configRef = fsDb.collection('barbearia').doc('config');
  bookingsRef = fsDb.collection('barbearia_bookings');

  configRef.onSnapshot(snap=>{
    data = data || {config:{...DEFAULT_CONFIG}, bookings:[], blockedDates:[]};
    if(snap.exists){
      data.config = {...DEFAULT_CONFIG, ...snap.data()};
      if(!data.config.services || !data.config.services.length) data.config.services = DEFAULT_SERVICES;
      data.config.services = withDefaultPrices(data.config.services);
      if(!data.config.slotStepMinutes) data.config.slotStepMinutes = 15;
      data.blockedDates = data.config.blockedDates || [];
    } else {
      data.config = {...DEFAULT_CONFIG};
      data.blockedDates = [];
      configRef.set({...DEFAULT_CONFIG}).catch(e=>console.error('config init failed', e));
    }
    configLoaded = true;
    render();
  }, err=>{
    console.error('config listener error', err);
    firebaseUnavailable = true;
    render();
  });

  fechosRef = fsDb.collection('barbearia_fechos');
  fechosRef.onSnapshot(snap=>{
    fechos = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }, err=>console.error('fechos listener error', err));

  bookingsRef.onSnapshot(snap=>{
    data = data || {config:{...DEFAULT_CONFIG}, bookings:[], blockedDates:[]};
    data.bookings = snap.docs.map(doc=>({id: doc.id, ...doc.data()}));
    bookingsLoaded = true;
    render();
  }, err=>{
    console.error('bookings listener error', err);
    firebaseUnavailable = true;
    render();
  });
}

function generateWorkDates(numDays, locationFilter){
  const out = [];
  const now = new Date();
  let d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let guard = 0;
  const maxGuard = locationFilter ? numDays*10+60 : numDays*6+30;
  while(out.length < numDays && guard < maxGuard){
    const k = dateKey(d);
    const dow = d.getDay();
    const isWorkday = data.config.workDays.includes(dow) && !data.blockedDates.includes(k);
    const matchesLocation = !locationFilter || (data.config.locationsByDay||{})[dow] === locationFilter;
    if(isWorkday && matchesLocation){
      out.push(k);
    }
    d.setDate(d.getDate()+1);
    guard++;
  }
  return out;
}

function existingIntervals(dateKeyStr, excludeId){
  return data.bookings
    .filter(b => b.date === dateKeyStr && b.id !== excludeId && (b.status === 'pending' || b.status === 'confirmed' || b.status === 'blocked'))
    .map(b => ({start: minutesFromTime(b.time), dur: b.duration || data.config.slotStepMinutes}));
}

function generateSlots(dateKeyStr, durationMinutes, excludeId){
  const cfg = data.config;
  if(data.blockedDates.includes(dateKeyStr)) return [];
  const slots = [];
  const now = new Date();
  const isToday = dateKeyStr === dateKey(now);
  const leadCutoff = new Date(now.getTime() + cfg.leadMinutes*60000);
  const busy = existingIntervals(dateKeyStr, excludeId);
  const step = cfg.slotStepMinutes || 15;

  let cur = cfg.startHour*60;
  const end = cfg.endHour*60;
  while(cur + durationMinutes <= end){
    const h = Math.floor(cur/60), m = cur%60;
    const label = timeStr(h,m);
    const [yy,mm,dd] = dateKeyStr.split('-').map(Number);
    const slotDate = new Date(yy, mm-1, dd, h, m);
    let available = true;
    if(isToday && slotDate < leadCutoff) available = false;
    if(available && busy.some(bz => overlaps(cur, durationMinutes, bz.start, bz.dur))) available = false;
    if(available) slots.push(label);
    cur += step;
  }
  return slots;
}

function mailtoLink(to, subject, body){
  return 'mailto:'+encodeURIComponent(to)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
}
function openMail(to, subject, body){
  const a = document.createElement('a');
  a.href = mailtoLink(to, subject, body);
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

async function sendClientEmail(to, name, subject, body){
  if(emailjsReady && EMAILJS_SERVICE_ID.indexOf('COLA_AQUI')===-1){
    try{
      await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_CLIENT_TEMPLATE_ID, {
        to_email: to, to_name: name, subject: subject, message: body
      });
      return true;
    }catch(e){
      console.error('EmailJS client send failed', e);
    }
  }
  openMail(to, subject, body);
  return false;
}

function notify(msg){
  uiMessage = msg;
  render();
}
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      notify('Copiado! Cola no teu email.');
    }).catch(()=>{ fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); notify('Copiado! Cola no teu email.'); }
  catch(e){ notify('Não foi possível copiar automaticamente. Seleciona o texto manualmente.'); }
  document.body.removeChild(ta);
}

async function addTimeRangeBlock(){
  if(!blockRangeStart || !blockTimeFrom || !blockTimeTo) return;
  const endDateStr = blockRangeEnd || blockRangeStart;
  const [sy,sm,sd] = blockRangeStart.split('-').map(Number);
  const [ey,em,ed] = endDateStr.split('-').map(Number);
  let d = new Date(sy,sm-1,sd);
  const endD = new Date(ey,em-1,ed);
  if(d > endD){ notify('A data de fim tem de ser igual ou posterior à data de início.'); return; }

  const step = data.config.slotStepMinutes || 15;
  const fromMin = minutesFromTime(blockTimeFrom);
  const toMin = minutesFromTime(blockTimeTo);
  if(toMin <= fromMin){ notify('A hora de fim tem de ser depois da hora de início.'); return; }

  let guard = 0;
  const batch = fsDb.batch();
  let count = 0;
  while(d <= endD && guard < 366){
    const k = dateKey(d);
    const busy = existingIntervals(k);
    let cur = fromMin;
    while(cur < toMin){
      const label = timeStr(Math.floor(cur/60), cur%60);
      const alreadyBlocked = data.bookings.some(b=>b.date===k && b.time===label && b.status==='blocked');
      const takenByReal = busy.some(bz => overlaps(cur, step, bz.start, bz.dur));
      if(!alreadyBlocked && !takenByReal){
        const newRef = bookingsRef.doc();
        batch.set(newRef, {
          date:k, time:label, duration:step, name:'Bloqueado', email:'', phone:'', note:'',
          status:'blocked', createdAt:Date.now()
        });
        count++;
      }
      cur += step;
    }
    d.setDate(d.getDate()+1);
    guard++;
  }
  if(count===0){ blockRangeStart=''; blockRangeEnd=''; blockTimeFrom=''; blockTimeTo=''; render(); return; }
  try{
    await batch.commit();
  }catch(e){
    console.error('range block failed', e);
    notify('Não foi possível guardar o bloqueio. Tenta novamente.');
    return;
  }
  blockRangeStart=''; blockRangeEnd=''; blockTimeFrom=''; blockTimeTo='';
  render();
}

async function addVacationBlock(){
  if(!vacStart){ return; }
  const endStr = vacEnd || vacStart;
  const [sy,sm,sd] = vacStart.split('-').map(Number);
  const [ey,em,ed] = endStr.split('-').map(Number);
  let d = new Date(sy,sm-1,sd);
  const endD = new Date(ey,em-1,ed);
  if(d > endD){ return; }
  let guard = 0;
  const newBlocked = [...data.blockedDates];
  while(d <= endD && guard < 366){
    const k = dateKey(d);
    if(!newBlocked.includes(k)) newBlocked.push(k);
    d.setDate(d.getDate()+1);
    guard++;
  }
  newBlocked.sort();
  try{
    await configRef.set({blockedDates: newBlocked}, {merge:true});
  }catch(e){
    console.error('vacation block failed', e);
    notify('Não foi possível guardar o bloqueio. Tenta novamente.');
    return;
  }
  vacStart = ''; vacEnd = '';
  render();
}

// ---------- fecho do dia ----------
function todayKey(){ return dateKey(new Date()); }
function serviceFor(b){
  return data.config.services.find(s=>s.id===b.serviceId) || data.config.services.find(s=>s.name===b.serviceName) || null;
}
function closingFor(date){ return fechos.find(f=>f.id===date) || null; }
function initCloseRows(date){
  closeRows = {}; closeExtras = [];
  const day = data.bookings.filter(b=>b.date===date && b.status==='confirmed');
  const saved = closingFor(date);
  day.forEach(b=>{
    const prev = saved && (saved.items||[]).find(i=>i.bookingId===b.id);
    const svc = serviceFor(b);
    closeRows[b.id] = prev ? {attended: prev.attended, price: prev.price} : {attended:true, price: svc ? (svc.price||0) : 0};
  });
  if(saved) closeExtras = (saved.items||[]).filter(i=>!i.bookingId).map(i=>({serviceName:i.serviceName, price:i.price}));
  closeInit = date;
}
function closeTotals(date){
  const day = data.bookings.filter(b=>b.date===date && b.status==='confirmed');
  let count=0,total=0;
  day.forEach(b=>{ const r=closeRows[b.id]; if(r && r.attended){ count++; total+=Number(r.price)||0; } });
  closeExtras.forEach(x=>{ count++; total+=Number(x.price)||0; });
  return {count,total};
}
async function saveClosing(){
  const date = closeDate || todayKey();
  const day = data.bookings.filter(b=>b.date===date && b.status==='confirmed').sort((a,b)=>a.time.localeCompare(b.time));
  const items = [];
  day.forEach(b=>{
    const r = closeRows[b.id] || {attended:true, price:0};
    items.push({bookingId:b.id, name:b.name, serviceName:b.serviceName||'', time:b.time, attended:!!r.attended, price:Number(r.price)||0});
  });
  closeExtras.forEach(x=>items.push({bookingId:null, name:'Sem marcação', serviceName:x.serviceName, time:'', attended:true, price:Number(x.price)||0}));
  const t = closeTotals(date);
  try{
    await fechosRef.doc(date).set({date, items, count:t.count, total:t.total, closedAt:Date.now()});
  }catch(e){ console.error(e); notify('Não foi possível guardar o fecho. Tenta novamente.'); return; }
  closeEditing = false;
  notify('Dia fechado: '+t.count+' serviço'+(t.count===1?'':'s')+' · '+money(t.total)+'.');
}

function repRange(){
  const now = new Date();
  const k = d => dateKey(d);
  if(repPreset==='today'){ return [k(now), k(now)]; }
  if(repPreset==='week'){
    const off = (now.getDay()+6)%7;
    const mon = new Date(now); mon.setDate(now.getDate()-off);
    const sun = new Date(mon); sun.setDate(mon.getDate()+6);
    return [k(mon), k(sun)];
  }
  if(repPreset==='last7'){ const a = new Date(now); a.setDate(now.getDate()-6); return [k(a), k(now)]; }
  if(repPreset==='lastmonth'){
    const a = new Date(now.getFullYear(), now.getMonth()-1, 1), b = new Date(now.getFullYear(), now.getMonth(), 0);
    return [k(a), k(b)];
  }
  if(repPreset==='custom'){ return [repFrom || k(now), repTo || repFrom || k(now)]; }
  const a = new Date(now.getFullYear(), now.getMonth(), 1), b = new Date(now.getFullYear(), now.getMonth()+1, 0);
  return [k(a), k(b)];
}

function renderMonthly(){
  const now = new Date();
  const months = [];
  for(let i=cmpMonths-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({key: d.getFullYear()+'-'+pad(d.getMonth()+1), label: MONTHS[d.getMonth()], year: d.getFullYear(), total:0, count:0});
  }
  fechos.forEach(f=>{
    const m = months.find(x=>x.key===f.id.slice(0,7));
    if(m){ m.total += f.total||0; m.count += f.count||0; }
  });
  const val = m => cmpMetric==='total' ? m.total : m.count;
  const fmt = v => cmpMetric==='total' ? money(v).replace(',00','') : String(v);
  const max = Math.max(1, ...months.map(val));
  const cur = months[months.length-1], prev = months[months.length-2];
  let h = '<div style="margin-top:22px;border-top:1px solid var(--line);padding-top:18px;">';
  h += '<div class="section-title">Comparação por mês</div>';
  h += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">';
  [['total','Faturação'],['count','Nº de serviços']].forEach(p=>{
    h += '<button class="btn btn-sm '+(cmpMetric===p[0]?'btn-primary':'btn-ghost')+'" data-action="cmp-metric" data-v="'+p[0]+'">'+p[1]+'</button>';
  });
  [6,12].forEach(n=>{
    h += '<button class="btn btn-sm '+(cmpMonths===n?'btn-primary':'btn-ghost')+'" data-action="cmp-months" data-v="'+n+'">'+n+' meses</button>';
  });
  h += '</div>';
  h += '<div style="display:flex;align-items:flex-end;gap:'+(cmpMonths>6?6:12)+'px;height:190px;padding-top:22px;">';
  months.forEach((m,i)=>{
    const v = val(m), pct = Math.max(v>0?3:0, Math.round(v/max*100));
    const isCur = i===months.length-1;
    h += '<div style="flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;">'+
      '<div style="font-size:'+(cmpMonths>6?10:12)+'px;font-weight:700;margin-bottom:5px;color:'+(isCur?'var(--ink)':'#6B5D4C')+';white-space:nowrap;">'+(v? fmt(v):'—')+'</div>'+
      '<div style="width:100%;height:'+pct+'%;background:'+(isCur?'var(--accent)':'#E8A92A')+';border-radius:5px 5px 0 0;min-height:'+(v?3:0)+'px;"></div></div>';
  });
  h += '</div>';
  h += '<div style="display:flex;gap:'+(cmpMonths>6?6:12)+'px;border-top:1px solid var(--line2);padding-top:6px;">';
  months.forEach((m,i)=>{
    h += '<div style="flex:1;min-width:0;text-align:center;font-size:'+(cmpMonths>6?10:12)+'px;color:'+(i===months.length-1?'var(--ink)':'var(--muted)')+';text-transform:uppercase;letter-spacing:.04em;">'+m.label+(m.label==='jan'||i===0?'<br><span style="opacity:.6">'+String(m.year).slice(2)+'</span>':'')+'</div>';
  });
  h += '</div>';
  // resumo: mês em curso vs o mesmo período do mês passado (justo, porque o mês em curso está incompleto)
  const dayNow = now.getDate();
  let prevPart = 0;
  fechos.forEach(f=>{
    if(f.id.slice(0,7)===prev.key && Number(f.id.slice(8,10))<=dayNow){ prevPart += cmpMetric==='total' ? (f.total||0) : (f.count||0); }
  });
  const dv = val(cur) - prevPart;
  if(prevPart>0){
    const pc = Math.round(dv/prevPart*100);
    h += '<div style="margin-top:14px;font-size:14.5px;color:#6B5D4C;">Este mês até hoje vs mesmo período do mês passado: <b style="color:'+(dv>=0?'#6FE0B0':'#FF8A8E')+'">'+(dv>=0?'+':'−')+fmt(Math.abs(dv))+' ('+(dv>=0?'+':'−')+Math.abs(pc)+'%)</b></div>';
  } else {
    h += '<div style="margin-top:14px;font-size:14px;color:var(--muted);">Ainda não há dados do mês passado para comparar.</div>';
  }
  const best = months.reduce((a,b)=>val(b)>val(a)?b:a, months[0]);
  if(val(best)>0) h += '<div style="margin-top:4px;font-size:14px;color:var(--muted);">Melhor mês: <b style="color:var(--ink)">'+best.label+' '+best.year+'</b> · '+fmt(val(best))+'</div>';
  h += '<div class="empty-note" style="margin-top:8px;">Só contam os dias fechados. O mês em curso está incompleto.</div>';
  h += '</div>';
  return h;
}

function renderReport(){

  const docs = fechos.filter(f=>f.id>=lo && f.id<=hi).sort((a,b)=>b.id.localeCompare(a.id));
  const count = docs.reduce((a,f)=>a+(f.count||0),0);
  const total = docs.reduce((a,f)=>a+(f.total||0),0);
  const bySvc = {};
  docs.forEach(f=>(f.items||[]).forEach(i=>{
    if(!i.attended) return;
    const n = i.serviceName || 'Outro';
    bySvc[n] = bySvc[n] || {c:0,t:0};

  const presets = [['today','Hoje'],['week','Esta semana'],['last7','Últimos 7 dias'],['month','Este mês'],['lastmonth','Mês passado'],['custom','Período à escolha']];

    h += '<div class="grid2"><div><label>De</label><input type="date" id="rep-from" value="'+esc(repFrom||lo)+'"></div><div><label>Até</label><input type="date" id="rep-to" value="'+esc(repTo||hi)+'"></div></div>';
  }
  h += '<div style="font-size:13px;color:var(--muted);margin:12px 0 4px;">'+(lo===hi? fmtDateLong(lo) : fmtDateLong(lo)+' → '+fmtDateLong(hi))+'</div>';
  h += '<div style="font-size:30px;font-weight:800;line-height:1.1;">'+money(total)+'</div>';
  h += '<div style="font-size:14.5px;color:#6B5D4C;margin-top:4px;">'+count+' serviço'+(count===1?'':'s')+' · '+docs.length+' dia'+(docs.length===1?'':'s')+' fechado'+(docs.length===1?'':'s')+(count? ' · média '+money(total/count)+' por serviço':'')+'</div>';
  const svcKeys = Object.keys(bySvc);

    svcKeys.sort((a,b)=>bySvc[b].t-bySvc[a].t).forEach(n=>{

    h += '<div class="empty-note" style="margin-top:12px;">Sem dias fechados neste período. Só contam os dias em que carregas em “Fechar o dia”.</div>';
  }
  h += renderMonthly();
  h += '</div>';
  return h;

  const month = date.slice(0,7);
  const monthDocs = fechos.filter(f=>f.id.slice(0,7)===month);
  const mCount = monthDocs.reduce((a,f)=>a+(f.count||0),0);

  let html = '<div class="card">';
  html += '<button class="link-btn" data-action="toggle-closing">'+(showClosing?'Fechar “Fecho do dia”':'Fecho do dia · serviços e faturação')+'</button>';
  if(!showClosing){ html += '</div>'; return html; }

  html += '<div style="margin-top:12px;"><label>Dia</label><input type="date" id="close-date" value="'+esc(date)+'"></div>';

  if(saved && !closeEditing){
    html += '<div class="req" style="margin-top:14px;border-color:var(--confirm);">';
    html += '<div class="top"><span class="who">Dia fechado ✔</span><span class="when">'+fmtDateLong(date)+'</span></div>';
    html += '<div style="font-size:26px;font-weight:700;margin:6px 0;">'+saved.count+' serviço'+(saved.count===1?'':'s')+' · '+money(saved.total)+'</div>';
    (saved.items||[]).forEach(i=>{
      html += '<div class="blockeddate-row"><span>'+(i.time?esc(i.time)+' · ':'')+esc(i.name)+' · '+esc(i.serviceName)+(i.attended?'':' <i>(não veio)</i>')+'</span><span>'+(i.attended?money(i.price):'—')+'</span></div>';
    });
    html += '<div class="actions" style="margin-top:10px;"><button class="btn btn-ghost btn-sm" data-action="close-edit">Editar fecho</button></div>';
    html += '</div>';
  } else {
    const day = data.bookings.filter(b=>b.date===date && b.status==='confirmed').sort((a,b)=>a.time.localeCompare(b.time));
    html += '<div style="margin-top:14px;">';
    if(day.length===0) html += '<div class="empty-note">Sem marcações confirmadas neste dia.</div>';
    day.forEach(b=>{
      const r = closeRows[b.id] || {attended:true, price:0};
      html += '<div class="req"><div class="top"><span class="who">'+esc(b.time)+' · '+esc(b.name)+'</span>'+
        '<label style="margin:0;display:flex;gap:6px;align-items:center;font-weight:600;"><input type="checkbox" class="close-att" data-id="'+b.id+'" '+(r.attended?'checked':'')+'> Veio</label></div>'+
        '<div class="meta">'+esc(b.serviceName||'')+'</div>'+
        '<div style="display:flex;gap:8px;align-items:center;margin-top:8px;"><span style="font-size:14px;">Valor €</span>'+
        '<input type="number" class="close-price" data-id="'+b.id+'" min="0" step="0.5" value="'+(Number(r.price)||0)+'" style="max-width:110px;" '+(r.attended?'':'disabled')+'></div></div>';
    });
    html += '<div style="margin-top:10px;font-weight:600;font-size:14px;">Serviços sem marcação</div>';
    closeExtras.forEach((x,i)=>{
      html += '<div class="blockeddate-row"><span>'+esc(x.serviceName)+' · '+money(x.price)+'</span><button class="rm" data-action="close-extra-rm" data-index="'+i+'">Remover</button></div>';
    });
    html += '<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center;">'+
      '<select id="extra-svc" style="flex:1;min-width:140px;padding:10px;border:1px solid var(--line);border-radius:8px;">'+
      data.config.services.map((s,i)=>'<option value="'+i+'">'+esc(s.name)+'</option>').join('')+'</select>'+
      '<input type="number" id="extra-price" min="0" step="0.5" placeholder="€" style="max-width:90px;">'+
      '<button class="btn btn-ghost btn-sm" data-action="close-extra-add">+ Adicionar</button></div>';
    const t = closeTotals(date);
    html += '<div style="margin-top:16px;padding:12px;background:#FFF0C2;border:2px solid #1D1510;border-radius:8px;font-size:18px;font-weight:700;" id="close-total">'+t.count+' serviço'+(t.count===1?'':'s')+' · '+money(t.total)+'</div>';
    html += '<div style="margin-top:12px;"><button class="btn btn-primary" data-action="close-save">Fechar o dia</button>'+(saved?' <button class="btn btn-ghost" data-action="close-cancel-edit">Cancelar edição</button>':'')+'</div>';
    html += '<div class="empty-note" style="margin-top:8px;">Os preços por omissão vêm das Definições (serviços). Só conta quem tem “Veio” marcado.</div>';
    html += '</div>';
  }

  html += renderReport();
  html += '</div>';
  return html;
}

// ---------- render ----------

function render(){
  if(firebaseUnavailable){
    root.innerHTML = '<div class="header"><div class="brand">Painel indisponível</div>'+
      '<div class="tagline" style="margin-top:10px;">Não foi possível ligar à base de dados. Verifica a configuração do Firebase (firebaseConfig) no código, ou a tua ligação à internet.</div></div>';
    return;
  }
  if(!data || !configLoaded || !bookingsLoaded){ root.innerHTML = '<div class="loading">A preparar a agenda…</div>'; return; }
  const cfg = data.config;
  let html = '';
  html += '<div class="header"><div class="brandrow"><div><div class="brand">PP <span>Marcações</span></div>';
  html += '<div class="tagline">Painel do barbeiro — uso interno</div></div></div>';
  html += '<div class="stripe"></div></div>';

  html += renderBarberView();

  html += '<div class="footer-note">Painel privado — não partilhes este link.</div>';
  root.innerHTML = html;
  attachHandlers();
}

function renderBarberView(){

      html += '<label>Assunto</label><input type="text" id="email-subject" readonly value="'+esc(lastEmail.subject)+'">';

      html += '<div class="meta">'+esc(b.serviceName||'')+(b.location?' · 📍 '+esc(b.location):'')+'</div>';

  if(blocked.length){
    html += '<div class="card">';

  html += '<div class="grid2">';

  html += '<div><label>Hora de fim</label><input type="time" id="block-time-to" value="'+esc(blockTimeTo)+'"></div>';

  html += '</div>';

  html += '<div class="card">';
  html += '<div class="section-title">Férias / dias sem trabalhar</div>';

  html += '<div class="card">';
  html += '<button class="link-btn" data-action="toggle-config">'+(showConfig?'Fechar definições':'Definições da barbearia')+'</button>';
  if(showConfig) html += renderConfigForm();

  return html;
}

function renderRescheduleCard(b){
  const dates = generateWorkDates(21);
  if(!dates.includes(b.date)) dates.unshift(b.date);
  const activeDate = editDate || b.date;
  let html = '<div class="req" style="border-color:var(--brass);">';
  html += '<div class="top"><span class="who">'+esc(b.name)+'</span><span class="when">Atual: '+fmtDateLong(b.date)+' · '+b.time+'</span></div>';
  html += '<div class="meta">'+esc(b.serviceName||'')+' · '+formatDuration(b.duration)+'</div>';
  html += '<div style="margin-top:12px;"><div class="section-title">Novo dia</div><div class="daylist">';
  dates.forEach(dk=>{
    const [y,m,d] = dk.split('-').map(Number);
    const dt = new Date(y,m-1,d);
    const sel = dk===activeDate;
    html += '<div class="daychip '+(sel?'selected':'')+'" data-action="pick-editdate" data-id="'+b.id+'" data-date="'+dk+'">'+
      '<div class="dow">'+DOW[dt.getDay()]+'</div><div class="dnum">'+d+'</div></div>';
  });
  html += '</div></div>';

  const slots = generateSlots(activeDate, b.duration, b.id);
  html += '<div style="margin-top:12px;"><div class="section-title">Novo horário</div>';
  if(slots.length===0){
    html += '<div class="empty-note">Sem horários livres nesse dia para esta duração.</div>';
  } else {
    html += '<div class="slotgrid">';
    slots.forEach(s=>{
      html += '<div class="slot '+(s===editTime?'selected':'')+'" data-action="pick-edittime" data-id="'+b.id+'" data-time="'+s+'">'+s+'</div>';
    });
    html += '</div>';
  }
  html += '</div>';

  html += '<div class="actions" style="margin-top:14px;">';
  html += '<button class="btn btn-confirm btn-sm" data-action="save-edit" '+(editTime?'':'disabled')+'>Guardar novo horário</button>';
  html += '<button class="btn btn-ghost btn-sm" data-action="cancel-edit">Cancelar edição</button>';
  html += '</div></div>';
  return html;
}

function attachHandlers(){
  root.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', onAction);
  });
  const rf = document.getElementById('rep-from');
  if(rf){ rf.addEventListener('change', ()=>{ repFrom = rf.value; render(); }); }
  const rt = document.getElementById('rep-to');
  if(rt){ rt.addEventListener('change', ()=>{ repTo = rt.value; render(); }); }
  const cd = document.getElementById('close-date');
  if(cd){ cd.addEventListener('change', ()=>{ closeDate = cd.value; closeInit=''; closeEditing=false; render(); }); }
  root.querySelectorAll('.close-att').forEach(el=>{
    el.addEventListener('change', ()=>{ closeRows[el.dataset.id] = closeRows[el.dataset.id] || {attended:true, price:0}; closeRows[el.dataset.id].attended = el.checked; render(); });
  });
  root.querySelectorAll('.close-price').forEach(el=>{
    el.addEventListener('input', ()=>{
      closeRows[el.dataset.id] = closeRows[el.dataset.id] || {attended:true, price:0};
      closeRows[el.dataset.id].price = Number(el.value)||0;
      const t = closeTotals(closeDate || todayKey());
      const box = document.getElementById('close-total');
      if(box) box.textContent = t.count+' serviço'+(t.count===1?'':'s')+' · '+money(t.total);
    });
  });
  const pi = document.getElementById('pass-input');
  if(pi){ pi.addEventListener('input', ()=>{ passInput = pi.value; }); }
  const vs = document.getElementById('vac-start');
  if(vs){ vs.addEventListener('input', ()=>{ vacStart = vs.value; }); }
  const ve = document.getElementById('vac-end');
  if(ve){ ve.addEventListener('input', ()=>{ vacEnd = ve.value; }); }
  const bs = document.getElementById('block-start');
  if(bs){ bs.addEventListener('input', ()=>{ blockRangeStart = bs.value; }); }
  const be = document.getElementById('block-end');
  if(be){ be.addEventListener('input', ()=>{ blockRangeEnd = be.value; }); }
  const btf = document.getElementById('block-time-from');
  if(btf){ btf.addEventListener('input', ()=>{ blockTimeFrom = btf.value; }); }
  const btt = document.getElementById('block-time-to');
  if(btt){ btt.addEventListener('input', ()=>{ blockTimeTo = btt.value; }); }
}

function readServicesFromForm(){
  const rows = root.querySelectorAll('#svc-list .svcrow');
  const services = [];
  rows.forEach(row=>{
    const name = row.querySelector('.svc-name').value.trim();
    const minutes = Number(row.querySelector('.svc-min').value);
    if(name && minutes>0){
      const existingIdx = Number(row.dataset.svcIndex);
      const existingId = data.config.services[existingIdx] ? data.config.services[existingIdx].id : null;
      const price = Number(row.querySelector('.svc-price').value)||0;
      services.push({id: existingId || ('svc_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)), name, minutes, price});
    }
  });
  return services;
}

function onAction(e){
  const el = e.currentTarget;
  const action = el.dataset.action;

  if(action==='unlock'){
    if(passInput === data.config.passcode){ barberUnlocked = true; passError=false; }
    else { passError = true; }
    render(); return;
  }
  if(action==='cmp-metric'){ cmpMetric = el.dataset.v; render(); return; }
  if(action==='cmp-months'){ cmpMonths = Number(el.dataset.v); render(); return; }
  if(action==='rep-preset'){
    repPreset = el.dataset.p;
    if(repPreset==='custom' && !repFrom){ const [a,b]=repRange(); repFrom=a; repTo=b; }
    render(); return;
  }
  if(action==='accept-change'){ acceptChange(el.dataset.id); return; }
  if(action==='decline-change'){ declineChange(el.dataset.id); return; }
  if(action==='toggle-closing'){ showClosing = !showClosing; if(showClosing){ closeInit=''; } render(); return; }
  if(action==='close-save'){ saveClosing(); return; }
  if(action==='close-edit'){ closeEditing = true; closeInit=''; render(); return; }
  if(action==='close-cancel-edit'){ closeEditing = false; closeInit=''; render(); return; }
  if(action==='close-extra-add'){
    const idx = Number(document.getElementById('extra-svc').value);
    const svc = data.config.services[idx];
    const p = document.getElementById('extra-price').value;
    closeExtras.push({serviceName: svc.name, price: p!=='' ? Number(p) : (svc.price||0)});
    render(); return;
  }
  if(action==='close-extra-rm'){ closeExtras.splice(Number(el.dataset.index),1); render(); return; }
  if(action==='decide'){ decideBooking(el.dataset.id, el.dataset.decision); return; }
  if(action==='request-cancel'){ requestCancelBooking(el.dataset.id); return; }
  if(action==='dismiss-cancel'){ dismissCancelBooking(); return; }
  if(action==='cancel-booking'){ cancelBooking(el.dataset.id); return; }
  if(action==='start-edit'){ startEditBooking(el.dataset.id); return; }
  if(action==='cancel-edit'){ cancelEditBooking(); return; }
  if(action==='pick-editdate'){ editDate = el.dataset.date; editTime = null; render(); return; }
  if(action==='pick-edittime'){ editTime = el.dataset.time; render(); return; }
  if(action==='save-edit'){ saveEditBooking(); return; }
  if(action==='copy-email'){
    const text = 'Para: '+lastEmail.to+'\nAssunto: '+lastEmail.subject+'\n\n'+lastEmail.body;
    copyText(text);
    return;
  }
  if(action==='reopen-email'){ openMail(lastEmail.to, lastEmail.subject, lastEmail.body); return; }
  if(action==='close-email'){ lastEmail = null; render(); return; }
  if(action==='close-notify'){ uiMessage = null; render(); return; }
  if(action==='toggle-block'){ toggleBlock(el.dataset.date, el.dataset.time); return; }
  if(action==='add-vacation'){ addVacationBlock(); return; }
  if(action==='add-timeblock'){ addTimeRangeBlock(); return; }
  if(action==='remove-vacation'){ removeBlockedDate(el.dataset.date); return; }
  if(action==='toggle-config'){ showConfig = !showConfig; render(); return; }
  if(action==='toggle-day'){
    const day = Number(el.dataset.day);
    const idx = data.config.workDays.indexOf(day);
    if(idx>=0) data.config.workDays.splice(idx,1); else data.config.workDays.push(day);
    render(); return;
  }
  if(action==='add-service'){
    const services = readServicesFromForm();
    services.push({id:'svc_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), name:'', minutes:30, price:0});
    data.config.services = services;
    render(); return;
  }
  if(action==='remove-service'){
    const services = readServicesFromForm();
    const idx = Number(el.dataset.index);
    services.splice(idx,1);
    if(services.length===0) services.push({...DEFAULT_SERVICES[0]});
    data.config.services = services;
    render(); return;
  }
  if(action==='save-config'){
    const services = readServicesFromForm();
    const locationsByDay = {};
    root.querySelectorAll('[data-loc-day]').forEach(row=>{
      const day = row.dataset.locDay;
      const val = row.querySelector('.loc-input').value.trim();
      if(val) locationsByDay[day] = val;
    });
    const newCfg = {
      ...data.config,
      barbershopName: document.getElementById('c-name').value.trim() || 'Barbearia',
      address: document.getElementById('c-address').value.trim(),
      phone: document.getElementById('c-phone').value.trim(),
      instagramUrl: document.getElementById('c-insta').value.trim(),
      barberEmail: document.getElementById('c-barber-email').value.trim(),
      startHour: Number(document.getElementById('c-start').value),
      endHour: Number(document.getElementById('c-end').value),
      slotStepMinutes: Number(document.getElementById('c-step').value),
      leadMinutes: Number(document.getElementById('c-lead').value),
      passcode: document.getElementById('c-pass').value.trim() || '1234',
      services: services.length ? services : DEFAULT_SERVICES,
      locationsByDay: locationsByDay
    };
    saveConfig(newCfg);
    return;
  }
}

function initEmailJs(){
  try{
    if(typeof emailjs !== 'undefined' && EMAILJS_PUBLIC_KEY.indexOf('COLA_AQUI')===-1){
      emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
      emailjsReady = true;
    }
  }catch(e){
    console.error('EmailJS init failed', e);
    emailjsReady = false;
  }
}

initEmailJs();
initFirebase();
</script>
