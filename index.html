<style>
  :root{
    --bg:#0E1116; --bg2:#12161D; --card:#151A22; --line:#252C39; --line2:#2F3745;
    --text:#F1F3F7; --muted:#8A93A3; --accent:#2F5BD3; --accent2:#4A74EE; --danger:#E5484D; --ok:#3FB27F;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Archivo Black','Inter',sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:.01em;margin:0;}
  a{color:inherit;}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px;}
  .narrow{max-width:680px;margin:0 auto;padding:0 20px;}

  /* nav */
  .nav{position:sticky;top:0;z-index:50;background:rgba(14,17,22,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  .nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;}
  .logo{font-family:'Archivo Black',sans-serif;font-style:italic;font-size:30px;letter-spacing:-.02em;color:#fff;text-decoration:none;line-height:1;}
  .logo i{color:var(--accent2);font-size:13px;vertical-align:top;margin-left:2px;font-style:normal;}
  .navlinks{display:flex;align-items:center;gap:26px;}
  .navlinks a{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#C3C9D4;text-decoration:none;}
  .navlinks a:hover{color:#fff;}
  .navlinks .ig{display:inline-flex;}
  .navcta{background:var(--accent);color:#fff !important;padding:11px 20px;border-radius:7px;}
  .navcta:hover{background:var(--accent2);}

  .hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,17,22,.97) 0%,rgba(14,17,22,.88) 38%,rgba(14,17,22,.45) 70%,rgba(14,17,22,.65) 100%);}
  .hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(180deg,rgba(14,17,22,0),var(--bg));}
  .hero .wrap{position:relative;z-index:2;width:100%;padding-top:60px;padding-bottom:80px;}
  .hero h1{font-size:clamp(34px,11vw,128px);line-height:.95;}
  .hero h1 .pp{display:block;color:#fff;}
  .hero h1 .mc{display:block;color:var(--accent);}
  .hero .sub{margin:22px 0 28px;font-size:13px;letter-spacing:.42em;text-transform:uppercase;color:#9AA3B2;}
  .hero .cta{display:flex;gap:12px;flex-wrap:wrap;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1.5px solid transparent;border-radius:7px;padding:15px 24px;
    font-family:'Inter',sans-serif;font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:none;
    transition:background .15s,border-color .15s,transform .05s;}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent2);}
  .btn-primary:disabled{background:#2A3350;color:#7A86A5;cursor:not-allowed;}
  .btn-ghost{background:transparent;border-color:var(--line2);color:var(--text);}
  .btn-ghost:hover{border-color:#fff;}
  .btn-danger{background:transparent;border-color:var(--danger);color:#FF8A8E;}
  .btn-block{width:100%;}

  /* sections */
  section{padding:56px 0;}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--accent2);margin-bottom:8px;}
  .sect-title{font-size:clamp(30px,5vw,44px);margin-bottom:26px;}
  .locgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;}
  .loccard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px;}
  .loccard .dot{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent2);}
  .loccard .dot::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent2);}
  .loccard h3{font-size:34px;margin:10px 0 6px;}
  .loccard .addr{color:var(--muted);font-size:14.5px;margin-bottom:20px;}
  .hours{margin-bottom:22px;}
  .hours .row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px;}
  .hours .row:last-child{border-bottom:none;}
  .hours .d{color:#9AA7BD;} .hours .h{color:#fff;font-weight:500;} .hours .h.off{color:#4A5366;}

  .pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .pgrid div{aspect-ratio:1/1;border-radius:8px;background-size:cover;background-position:center;border:1px solid var(--line);}

  /* booking flow */
  #marcar{scroll-margin-top:70px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:16px;}
  .section-title{font-family:'Archivo Black',sans-serif;text-transform:uppercase;font-size:16px;letter-spacing:.04em;margin:0 0 14px;}
  .servicegrid{display:flex;flex-wrap:wrap;gap:10px;}
  .service{border:1.5px solid var(--line2);background:var(--bg2);border-radius:9px;padding:14px 18px;cursor:pointer;min-width:150px;transition:border-color .15s,background .15s;}
  .service .sname{font-weight:700;font-size:15px;}
  .service .sdur{font-size:13px;color:var(--muted);margin-top:3px;}
  .service:hover{border-color:var(--accent2);}
  .service.selected{background:var(--accent);border-color:var(--accent);}
  .service.selected .sdur{color:#DCE5FF;}
  .daylist{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;}
  .daychip{flex:0 0 auto;width:58px;text-align:center;border:1.5px solid var(--line2);background:var(--bg2);border-radius:9px;padding:10px 0;cursor:pointer;}
  .daychip .dow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
  .daychip .dnum{font-size:20px;font-weight:800;margin-top:2px;}
  .daychip:hover{border-color:var(--accent2);}
  .daychip.selected{background:var(--accent);border-color:var(--accent);}
  .daychip.selected .dow{color:#DCE5FF;}
  .slotgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .slot{border:1.5px solid var(--line2);background:var(--bg2);border-radius:8px;padding:10px 15px;font-size:14.5px;cursor:pointer;font-weight:600;}
  .slot:hover{border-color:var(--accent2);}
  .slot.selected{background:var(--accent);border-color:var(--accent);}
  .empty-note{color:var(--muted);font-size:14.5px;padding:6px 0;}
  label{display:block;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#AEB7C6;margin:16px 0 7px;}
  input[type=text],input[type=email],input[type=tel],textarea{width:100%;border:1.5px solid var(--line2);border-radius:8px;padding:12px 14px;font-family:'Inter',sans-serif;font-size:15px;color:var(--text);background:var(--bg);}
  input:focus,textarea:focus{outline:2px solid var(--accent2);outline-offset:1px;border-color:var(--accent2);}
  textarea{resize:vertical;min-height:70px;}
  ::placeholder{color:#5D6678;}
  .error-text{color:#FF8A8E;font-size:13.5px;margin-top:8px;}
  .success{text-align:center;padding:40px 22px;}
  .success .mark{width:56px;height:56px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 14px;}
  .success h2{font-size:26px;margin-bottom:10px;}
  .success p{color:#B7BFCD;font-size:15px;margin:0 0 20px;line-height:1.5;}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;}
  .kv:last-of-type{border-bottom:none;} .kv span{color:var(--muted);}

<script>
const DOW = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MONTHS = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

const DEFAULT_PRICES = {corte:15, corte_barba:20, barba:8};
function withDefaultPrices(list){ return (list||[]).map(function(s){ var p=Number(s.price)||0; return p>0 ? s : Object.assign({}, s, {price: DEFAULT_PRICES[s.id]||0}); }); }

// ===== FIREBASE =====

  storageBucket: "marcacoes-pp.firebasestorage.app",
  messagingSenderId: "1061204569418",
  appId: "1:1061204569418:web:266e70c26f52327b40e5b3"
};
let fsDb = null;

const EMAILJS_PUBLIC_KEY = 'ZQKdCEaz_4oOX36RI';

const CANCEL_LIMIT_HOURS = 2; // até quantas horas antes o cliente pode cancelar/alterar
const manageToken = (new URLSearchParams(location.search)).get('m') || '';

function newToken(){
  const a = new Uint8Array(12);
  (window.crypto||window.msCrypto).getRandomValues(a);
  return Array.from(a).map(x=>x.toString(36).padStart(2,'0')).join('').slice(0,20);

function generateWorkDates(numDays, locationFilter){
  const out = [];
  const now = new Date();
  let d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let guard = 0;
  const maxGuard = locationFilter ? numDays*10+60 : numDays*6+30;
  while(out.length < numDays && guard < maxGuard){
    const k = dateKey(d);
    const dow = d.getDay();
    const isWorkday = data.config.workDays.includes(dow) && !data.blockedDates.includes(k);
    const matchesLocation = !locationFilter || (data.config.locationsByDay||{})[dow] === locationFilter;
    if(isWorkday && matchesLocation){
      out.push(k);
    }
    d.setDate(d.getDate()+1);
    guard++;
  }
  return out;
}
function getAvailableLocations(){
  const locs = data.config.locationsByDay || {};
  const seen = [];
  for(let dow=0; dow<7; dow++){
    const v = locs[dow];
    if(v && !seen.includes(v)) seen.push(v);
  }
  return seen;
}

function existingIntervals(dateKeyStr, excludeId){
  return data.bookings
    .filter(b => b.date === dateKeyStr && b.id !== excludeId && (b.status === 'pending' || b.status === 'confirmed' || b.status === 'blocked'))
    .map(b => ({start: minutesFromTime(b.time), dur: b.duration || data.config.slotStepMinutes}));
}

function generateSlots(dateKeyStr, durationMinutes, excludeId){
  const cfg = data.config;
  if(data.blockedDates.includes(dateKeyStr)) return [];
  const slots = [];
  const now = new Date();
  const isToday = dateKeyStr === dateKey(now);
  const leadCutoff = new Date(now.getTime() + cfg.leadMinutes*60000);
  const busy = existingIntervals(dateKeyStr, excludeId);
  const step = cfg.slotStepMinutes || 15;

  let cur = cfg.startHour*60;
  const end = cfg.endHour*60;
  while(cur + durationMinutes <= end){
    const h = Math.floor(cur/60), m = cur%60;
    const label = timeStr(h,m);
    const [yy,mm,dd] = dateKeyStr.split('-').map(Number);
    const slotDate = new Date(yy, mm-1, dd, h, m);
    let available = true;
    if(isToday && slotDate < leadCutoff) available = false;
    if(available && busy.some(bz => overlaps(cur, durationMinutes, bz.start, bz.dur))) available = false;
    if(available) slots.push(label);
    cur += step;
  }
  return slots;
}

async function sendBarberEmail(subject, message, booking){
  const cfg = data.config;
  if(!cfg.barberEmail) return;
  if(!(emailjsReady && EMAILJS_SERVICE_ID.indexOf('COLA_AQUI')===-1)) return;
  try{
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_BARBER_TEMPLATE_ID, {
      to_email: cfg.barberEmail,
      subject: subject,
      message: message,
      client_name: booking.name,
      client_email: booking.email || '',
      client_phone: booking.phone,
      service_name: booking.serviceName,
      location: booking.location || '',
      date_time: fmtDateLong(booking.date)+' às '+booking.time,
      note: booking.note || ''
    });
  }catch(e){
    console.error('EmailJS barber notify failed', e);
  }
}

    'Nome: '+booking.name+'\nEmail: '+(booking.email||'')+'\nTelemóvel: '+booking.phone+'\n'+
    'Serviço: '+booking.serviceName+'\nLocal: '+(booking.location||'')+'\n'+

function serviceById(id){ return data.config.services.find(s=>s.id===id); }

async function submitBooking(){
  submitError = '';
  if(!selectedLocation){ submitError = 'Escolhe onde queres cortar.'; render(); return; }
  if(!selectedService){ submitError = 'Escolhe o serviço.'; render(); return; }
  if(!selectedDate || !selectedTime){ submitError = 'Escolhe um dia e um horário.'; render(); return; }
  if(!form.name.trim()){ submitError = 'Falta o teu nome.'; render(); return; }
  if(!/^\S+@\S+\.\S+$/.test(form.email.trim())){ submitError = 'Email inválido.'; render(); return; }
  if(!form.phone.trim()){ submitError = 'Falta o teu número de telemóvel.'; render(); return; }
  if(!consent){ submitError = 'Tens de autorizar o tratamento dos dados para continuar.'; render(); return; }

  const svc = serviceById(selectedService);
  const stillFree = generateSlots(selectedDate, svc.minutes).includes(selectedTime);
  if(!stillFree){ submitError = 'Esse horário acabou de ficar indisponível. Escolhe outro.'; selectedTime=null; bookStep=3; render(); return; }

  const booking = {
    date: selectedDate,
    time: selectedTime,
    duration: svc.minutes,
    serviceId: svc.id,
    serviceName: svc.name,
    location: selectedLocation,
    name: form.name.trim(),
    email: form.email.trim(),
    phone: form.phone.trim(),
    note: form.note.trim(),
    status: 'pending',
    token: newToken(),
    consent: true,
    consentAt: Date.now(),
    createdAt: Date.now()
  };
  try{
    await bookingsRef.add(booking);
  }catch(e){
    console.error('submit failed', e);
    submitError = 'Não foi possível enviar o pedido. Tenta novamente.';
    render();
    return;
  }
  notifyBarberOfNewBooking(booking);
  lastManageLink = manageUrl(booking.token);
  submitted = true;
  bookStep = 5;
  render();
}

      else {
        html += '<div class="slotgrid">';
        slots.forEach(t=>{ html += '<div class="slot '+(t===mgTime?'selected':'')+'" data-action="mg-pick-time" data-time="'+t+'">'+t+'</div>'; });
        html += '</div>';
      }
    }
    html += '<label>Motivo (opcional)</label><textarea id="mg-reason" placeholder="Ex: tenho um compromisso nesse dia">'+esc(mgReason)+'</textarea>';
    if(mgError) html += '<div class="error-text">'+esc(mgError)+'</div>';
    html += '<div class="btnrow"><button class="btn btn-primary" data-action="mg-do-change" '+(mgDate&&mgTime?'':'disabled')+'>Enviar pedido</button>'+
      '<button class="btn btn-ghost" data-action="mg-back">Voltar atrás</button></div></div>';
  }
  return html;
}

async function mgCancel(){
  const b = data.bookings.find(x=>x.token===manageToken);
  if(!b || !canManage(b)){ mgError='Já não é possível cancelar online.'; render(); return; }
  try{
    await bookingsRef.doc(b.id).update({status:'cancelled', cancelledBy:'client', cancelReason: mgReason.trim(), cancelledAt: Date.now()});
  }catch(e){ console.error(e); mgError='Não foi possível cancelar. Tenta novamente.'; render(); return; }
  sendBarberEmail(b.name+' cancelou a marcação',
    b.name+' cancelou a marcação.\n\nServiço: '+b.serviceName+'\nLocal: '+(b.location||'')+'\nQuando: '+fmtDateLong(b.date)+' às '+b.time+
    (mgReason.trim()?'\nMotivo: '+mgReason.trim():'')+'\n\nO horário ficou livre.', b);
  mgDone = {title:'Marcação cancelada', text:'O barbeiro foi avisado. Podes voltar a marcar quando quiseres.'};
  mgMode=''; mgReason=''; mgError='';
  render();
}
async function mgRequestChange(){
  const b = data.bookings.find(x=>x.token===manageToken);
  if(!b || !canManage(b)){ mgError='Já não é possível alterar online.'; render(); return; }
  if(!generateSlots(mgDate, b.duration, b.id).includes(mgTime)){ mgError='Esse horário acabou de ficar indisponível. Escolhe outro.'; mgTime=null; render(); return; }
  try{
    await bookingsRef.doc(b.id).update({changeRequest:{date:mgDate, time:mgTime, reason:mgReason.trim(), at:Date.now()}});
  }catch(e){ console.error(e); mgError='Não foi possível enviar o pedido. Tenta novamente.'; render(); return; }
  sendBarberEmail(b.name+' pede para mudar o horário',
    b.name+' pede para mudar a marcação.\n\nServiço: '+b.serviceName+'\nLocal: '+(b.location||'')+
    '\nAtual: '+fmtDateLong(b.date)+' às '+b.time+'\nPedido: '+fmtDateLong(mgDate)+' às '+mgTime+
    (mgReason.trim()?'\nMotivo: '+mgReason.trim():'')+'\nTelemóvel: '+b.phone+'\n\nAceita ou recusa no painel de admin.', b);
  mgDone = {title:'Pedido enviado', text:'Pediste '+fmtDateLong(mgDate)+' às '+mgTime+'. Vais receber um email quando o barbeiro responder. Até lá, a marcação atual mantém-se.'};
  mgMode=''; mgReason=''; mgError=''; mgDate=null; mgTime=null;
  render();
}
async function mgWithdraw(){
  const b = data.bookings.find(x=>x.token===manageToken);
  if(!b) return;
  try{ await bookingsRef.doc(b.id).update({changeRequest: firebase.firestore.FieldValue.delete()}); }
  catch(e){ console.error(e); }
}

function updateConfirmBtn(){
  const b = document.getElementById('confirm-btn');
  if(b) b.disabled = !formReady();
}
function attachHandlers(){
  root.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', onAction);
  });
  const mr = document.getElementById('mg-reason');
  if(mr){ mr.addEventListener('input', ()=>{ mgReason = mr.value; }); }
  const cb = document.getElementById('f-consent');
  if(cb){ cb.addEventListener('change', ()=>{ consent = cb.checked; updateConfirmBtn(); }); }
  const inputs = ['f-name','f-email','f-phone','f-note'];
  inputs.forEach(id=>{
    const el = document.getElementById(id);
    if(el){
      el.addEventListener('input', ()=>{
        const map = {'f-name':'name','f-email':'email','f-phone':'phone','f-note':'note'};
        form[map[id]] = el.value; updateConfirmBtn();
      });
    }
  });
}

function onAction(e){
  const el = e.currentTarget;
  const action = el.dataset.action;

  if(action==='pick-location-go'){ selectedLocation = el.dataset.loc; selectedService=null; selectedDate=null; selectedTime=null; submitted=false; submitError=''; bookStep=2; keepSel=true; if(location.hash==='#/marcar'){ view='book'; render(); } else { location.hash='#/marcar'; } return; }
  if(action==='pick-location'){ selectedLocation = el.dataset.loc; selectedService=null; selectedDate=null; selectedTime=null; bookStep=2; render(); return; }
  if(action==='pick-service'){ selectedService = el.dataset.id; selectedDate=null; selectedTime=null; bookStep=3; render(); return; }
  if(action==='pick-date'){ selectedDate = el.dataset.date; selectedTime = null; render(); return; }
  if(action==='pick-time'){ selectedTime = el.dataset.time; render(); return; }
  if(action==='book-continue'){ if(selectedTime){ bookStep=4; submitError=''; render(); } return; }
  if(action==='book-back'){ if(bookStep<=1){ location.hash=''; } else { bookStep--; submitError=''; render(); } return; }
  if(action==='book-home'){ resetBooking(); location.hash=''; return; }
  if(action==='mg-open-cancel'){ mgMode='cancel'; mgError=''; render(); return; }
  if(action==='mg-open-change'){ mgMode='change'; mgError=''; mgDate=null; mgTime=null; render(); return; }
  if(action==='mg-back'){ mgMode=''; mgError=''; render(); return; }
  if(action==='mg-pick-date'){ mgDate=el.dataset.date; mgTime=null; render(); return; }
  if(action==='mg-pick-time'){ mgTime=el.dataset.time; render(); return; }
  if(action==='mg-do-cancel'){ mgCancel(); return; }
  if(action==='mg-do-change'){ mgRequestChange(); return; }
  if(action==='mg-withdraw'){ mgWithdraw(); return; }
  if(action==='mg-home'){ location.href = baseUrl(); return; }
  if(action==='submit'){ submitBooking(); return; }
  if(action==='new-booking'){
    resetBooking(); render(); return;
  }
}

function initEmailJs(){
  try{
    if(typeof emailjs !== 'undefined' && EMAILJS_PUBLIC_KEY.indexOf('COLA_AQUI')===-1){
      emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
      emailjsReady = true;
    }
  }catch(e){
    console.error('EmailJS init failed', e);
    emailjsReady = false;
  }
}

function route(){
  const h = location.hash;
  const nv = (h==='#/marcar') ? 'book' : 'home';
  if(nv==='book' && view!=='book' && !keepSel){ resetBooking(); }
  keepSel = false;
  view = nv; lastStep = -1;
  render();
  if(nv==='home'){
    const id = h.replace('#','');
    const t = (id && id.charAt(0)!=='/') ? document.getElementById(id) : null;
    if(t) t.scrollIntoView({behavior:'instant'}); else window.scrollTo({top:0,left:0,behavior:'instant'});
  }
}
window.addEventListener('hashchange', route);

initEmailJs();
initFirebase();
setTimeout(function(){ if(!(configLoaded && bookingsLoaded) && !firebaseUnavailable){ root.innerHTML='<div class="narrow"><div class="loading">Não foi possível carregar a agenda.<br>Abre o site pelo endereço https://marcacoespp.github.io/marcacoes-pp/ (não o ficheiro descarregado) e verifica a ligação à internet.<br><br><a class="btn btn-primary" href="" onclick="location.reload();return false;">Tentar de novo</a></div></div>'; } }, 12000);
</script>
