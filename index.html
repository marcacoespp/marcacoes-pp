<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PP Marcações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Firebase (base de dados gratuita e partilhada) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<!-- EmailJS (envio automático de emails, sem servidor próprio) -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
  :root{
    --ink:#241E18;
    --green:#A81717;
    --green-dark:#26201A;
    --oxblood:#7A2323;
    --brass:#9C7420;
    --parchment:#D9D2C4;
    --sage:#C7BDAB;
    --card:#F1ECE0;
    --line:#B7AC98;
    --danger:#B23324;
    --confirm:#2E6B3F;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--parchment);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:'Bebas Neue',sans-serif;
    font-weight:400;
    letter-spacing:.03em;
    margin:0;
    color:var(--green-dark);
  }
  .app{max-width:640px;margin:0 auto;padding:0 20px 60px;}
  .header{padding:28px 0 0;}
  .brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .brand{
    font-family:'UnifrakturCook',serif;font-weight:700;font-size:34px;
    color:var(--green-dark);letter-spacing:.5px;
    text-shadow:1px 1px 0 rgba(0,0,0,.12);
  }
  .insta-link{
    display:inline-flex;align-items:center;justify-content:center;
    width:38px;height:38px;border-radius:9px;border:1px solid var(--line);
    color:var(--ink);flex:0 0 auto;transition:border-color .15s ease, color .15s ease;
  }
  .insta-link:hover{border-color:var(--brass);color:var(--brass);}
  .tagline{font-size:14px;color:#5C5346;margin-top:4px;}
  .stripe{
    height:6px;margin:18px 0 22px;border-radius:2px;
    background:repeating-linear-gradient(
      -45deg,
      var(--green) 0px, var(--green) 10px,
      #000 10px, #000 20px,
      var(--brass) 20px, var(--brass) 24px,
      #000 24px, #000 28px
    );
  }
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;margin-bottom:16px;
  }
  .section-title{font-size:13px;font-weight:600;color:#6E6455;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}

  .daylist{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;}
  .daychip{
    flex:0 0 auto;border:1px solid var(--line);background:var(--card);
    border-radius:10px;padding:10px 14px;cursor:pointer;text-align:center;min-width:64px;
    transition:background .15s ease,border-color .15s ease;
  }
  .daychip .dow{font-size:11.5px;color:#6E6455;text-transform:uppercase;letter-spacing:.04em;}
  .daychip .dnum{font-family:'Bebas Neue',sans-serif;font-size:19px;font-weight:600;margin-top:2px;}
  .daychip.selected{background:var(--green);border-color:var(--green);}
  .daychip.selected .dow, .daychip.selected .dnum{color:#fff;}

  .servicegrid{display:flex;flex-wrap:wrap;gap:8px;}
  .service{
    border:1px solid var(--line);background:var(--card);border-radius:8px;
    padding:12px 16px;cursor:pointer;transition:background .15s ease,border-color .15s ease,color .15s ease;
    min-width:150px;
  }
  .service .sname{font-weight:600;font-size:15px;}
  .service .sdur{font-size:13px;color:#6E6455;margin-top:2px;}
  .service:hover{border-color:var(--brass);}
  .service.selected{background:var(--green);border-color:var(--green);}
  .service.selected .sname, .service.selected .sdur{color:#fff;}

  .slotgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .slot{
    border:1px solid var(--line);background:var(--card);border-radius:8px;
    padding:9px 14px;font-size:14.5px;cursor:pointer;font-weight:500;
    transition:background .15s ease,border-color .15s ease,color .15s ease;
  }
  .slot:hover{border-color:var(--brass);}
  .slot.selected{background:var(--brass);border-color:var(--brass);color:#fff;}
  .empty-note{color:#6E6455;font-size:14.5px;padding:6px 0;}

  label{display:block;font-size:13.5px;font-weight:600;color:var(--green-dark);margin:14px 0 6px;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=email],input[type=tel],textarea{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;
    font-family:'Work Sans',sans-serif;font-size:15px;color:var(--ink);background:#FBF7EC;
  }
  input:focus,textarea:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:var(--brass);}
  textarea{resize:vertical;min-height:60px;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:none;border-radius:8px;padding:12px 20px;font-family:'Work Sans',sans-serif;
    font-size:15px;font-weight:600;cursor:pointer;transition:filter .15s ease, transform .05s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--green);color:#fff;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:disabled{background:#B9C2B2;cursor:not-allowed;}
  .btn-block{width:100%;}
  .error-text{color:var(--danger);font-size:13.5px;margin-top:6px;}

  .success{text-align:center;padding:30px 10px;}
  .success .mark{font-size:40px;margin-bottom:8px;}
  .success h2{margin-bottom:8px;}
  .success p{color:#5C5346;font-size:15px;margin:0 0 20px;}

  .footer-note{color:#6E6455;font-size:12.5px;text-align:center;margin-top:30px;}
  .loading{color:#6E6455;font-size:14.5px;padding:20px 0;text-align:center;}
</style>
</head>
<body>
<div id="root" class="app"><div class="loading">A preparar a agenda…</div></div>

<script>
const DOW = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MONTHS = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

const DEFAULT_SERVICES = [
  {id:'corte', name:'Cabelo', minutes:50},
  {id:'corte_barba', name:'Cabelo + Barba', minutes:70},
  {id:'barba', name:'Barba', minutes:25}
];

const DEFAULT_CONFIG = {
  barbershopName: 'PP Marcações',
  address: '',
  phone: '',
  instagramUrl: 'https://www.instagram.com/pepzzzzzzz/',
  barberEmail: '',
  workDays: [2,3,4,5,6], // 0=domingo, 1=segunda, 2=terça...
  locationsByDay: {2:'Marinha Grande', 3:'Leiria', 4:'Leiria', 5:'Marinha Grande', 6:'Leiria'},
  startHour: 9,
  endHour: 19,
  slotStepMinutes: 15,
  leadMinutes: 60,
  passcode: '1234',
  services: DEFAULT_SERVICES,
  blockedDates: []
};

// ===== FIREBASE =====
// Usa aqui o MESMO firebaseConfig que colocaste no admin.html — ambos os ficheiros
// têm de apontar ao mesmo projeto Firebase para partilharem os dados.
const firebaseConfig = {
  apiKey: "AIzaSyB2MVvXo7LlhFa4e8twBCqr0gGb0zXH2JY",
  authDomain: "marcacoes-pp.firebaseapp.com",
  projectId: "marcacoes-pp",
  storageBucket: "marcacoes-pp.firebasestorage.app",
  messagingSenderId: "1061204569418",
  appId: "1:1061204569418:web:266e70c26f52327b40e5b3"
};
let fsDb = null;
let configRef = null;
let bookingsRef = null;
let bookingsLoaded = false;
let configLoaded = false;
let firebaseUnavailable = false;

// ===== EMAILJS (envio automático de emails) =====
// Usa aqui os MESMOS valores que colocaste no admin.html.
const EMAILJS_PUBLIC_KEY = 'ZQKdCEaz_4oOX36RI';
const EMAILJS_SERVICE_ID = 'service_5k8lt6p';
const EMAILJS_BARBER_TEMPLATE_ID = 'template_2xlakhy';
let emailjsReady = false;

let data = null; // {config, bookings:[], blockedDates:[]}

// client form state
let selectedLocation = null;
let selectedService = null;
let selectedDate = null;
let selectedTime = null;
let form = {name:'', email:'', phone:'', note:''};
let submitted = false;
let submitError = '';

const root = document.getElementById('root');

function pad(n){return n<10?'0'+n:''+n;}
function dateKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtDateLong(key){
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(y,m-1,d);
  return DOW[dt.getDay()]+', '+d+' '+MONTHS[m-1];
}
function timeStr(h,m){return pad(h)+':'+pad(m);}
function formatDuration(mins){
  if(mins>60){
    const h = Math.floor(mins/60), m = mins%60;
    return h+':'+pad(m)+'h';
  }
  return mins+' min';
}
function minutesFromTime(t){const [h,m]=t.split(':').map(Number); return h*60+m;}
function esc(s){return (s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
function overlaps(aStart,aDur,bStart,bDur){ return aStart < bStart+bDur && bStart < aStart+aDur; }

function initFirebase(){
  try{
    firebase.initializeApp(firebaseConfig);
    fsDb = firebase.firestore();
  }catch(e){
    console.error('Firebase init failed', e);
    firebaseUnavailable = true;
    render();
    return;
  }
  configRef = fsDb.collection('barbearia').doc('config');
  bookingsRef = fsDb.collection('barbearia_bookings');

  configRef.onSnapshot(snap=>{
    data = data || {config:{...DEFAULT_CONFIG}, bookings:[], blockedDates:[]};
    if(snap.exists){
      data.config = {...DEFAULT_CONFIG, ...snap.data()};
      if(!data.config.services || !data.config.services.length) data.config.services = DEFAULT_SERVICES;
      if(!data.config.slotStepMinutes) data.config.slotStepMinutes = 15;
      data.blockedDates = data.config.blockedDates || [];
    } else {
      data.config = {...DEFAULT_CONFIG};
      data.blockedDates = [];
    }
    configLoaded = true;
    render();
  }, err=>{
    console.error('config listener error', err);
    firebaseUnavailable = true;
    render();
  });

  bookingsRef.onSnapshot(snap=>{
    data = data || {config:{...DEFAULT_CONFIG}, bookings:[], blockedDates:[]};
    data.bookings = snap.docs.map(doc=>({id: doc.id, ...doc.data()}));
    bookingsLoaded = true;
    render();
  }, err=>{
    console.error('bookings listener error', err);
    firebaseUnavailable = true;
    render();
  });
}

function generateWorkDates(numDays, locationFilter){
  const out = [];
  const now = new Date();
  let d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let guard = 0;
  const maxGuard = locationFilter ? numDays*10+60 : numDays*6+30;
  while(out.length < numDays && guard < maxGuard){
    const k = dateKey(d);
    const dow = d.getDay();
    const isWorkday = data.config.workDays.includes(dow) && !data.blockedDates.includes(k);
    const matchesLocation = !locationFilter || (data.config.locationsByDay||{})[dow] === locationFilter;
    if(isWorkday && matchesLocation){
      out.push(k);
    }
    d.setDate(d.getDate()+1);
    guard++;
  }
  return out;
}
function getAvailableLocations(){
  const locs = data.config.locationsByDay || {};
  const seen = [];
  for(let dow=0; dow<7; dow++){
    const v = locs[dow];
    if(v && !seen.includes(v)) seen.push(v);
  }
  return seen;
}

function existingIntervals(dateKeyStr, excludeId){
  return data.bookings
    .filter(b => b.date === dateKeyStr && b.id !== excludeId && (b.status === 'pending' || b.status === 'confirmed' || b.status === 'blocked'))
    .map(b => ({start: minutesFromTime(b.time), dur: b.duration || data.config.slotStepMinutes}));
}

function generateSlots(dateKeyStr, durationMinutes, excludeId){
  const cfg = data.config;
  if(data.blockedDates.includes(dateKeyStr)) return [];
  const slots = [];
  const now = new Date();
  const isToday = dateKeyStr === dateKey(now);
  const leadCutoff = new Date(now.getTime() + cfg.leadMinutes*60000);
  const busy = existingIntervals(dateKeyStr, excludeId);
  const step = cfg.slotStepMinutes || 15;

  let cur = cfg.startHour*60;
  const end = cfg.endHour*60;
  while(cur + durationMinutes <= end){
    const h = Math.floor(cur/60), m = cur%60;
    const label = timeStr(h,m);
    const [yy,mm,dd] = dateKeyStr.split('-').map(Number);
    const slotDate = new Date(yy, mm-1, dd, h, m);
    let available = true;
    if(isToday && slotDate < leadCutoff) available = false;
    if(available && busy.some(bz => overlaps(cur, durationMinutes, bz.start, bz.dur))) available = false;
    if(available) slots.push(label);
    cur += step;
  }
  return slots;
}

async function notifyBarberOfNewBooking(booking){
  const cfg = data.config;
  if(!cfg.barberEmail) return;
  if(!(emailjsReady && EMAILJS_SERVICE_ID.indexOf('COLA_AQUI')===-1)) return;
  try{
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_BARBER_TEMPLATE_ID, {
      to_email: cfg.barberEmail,
      client_name: booking.name,
      client_phone: booking.phone,
      service_name: booking.serviceName,
      location: booking.location || '',
      date_time: fmtDateLong(booking.date)+' às '+booking.time,
      note: booking.note || ''
    });
  }catch(e){
    console.error('EmailJS barber notify failed', e);
  }
}

function serviceById(id){ return data.config.services.find(s=>s.id===id); }

async function submitBooking(){
  submitError = '';
  if(!selectedLocation){ submitError = 'Escolhe onde queres cortar.'; render(); return; }
  if(!selectedService){ submitError = 'Escolhe o serviço.'; render(); return; }
  if(!selectedDate || !selectedTime){ submitError = 'Escolhe um dia e um horário.'; render(); return; }
  if(!form.name.trim()){ submitError = 'Falta o teu nome.'; render(); return; }
  if(!/^\S+@\S+\.\S+$/.test(form.email.trim())){ submitError = 'Email inválido.'; render(); return; }
  if(!form.phone.trim()){ submitError = 'Falta o teu número de telemóvel.'; render(); return; }

  const svc = serviceById(selectedService);
  const stillFree = generateSlots(selectedDate, svc.minutes).includes(selectedTime);
  if(!stillFree){ submitError = 'Esse horário acabou de ficar indisponível. Escolhe outro.'; selectedTime=null; render(); return; }

  const booking = {
    date: selectedDate,
    time: selectedTime,
    duration: svc.minutes,
    serviceId: svc.id,
    serviceName: svc.name,
    location: selectedLocation,
    name: form.name.trim(),
    email: form.email.trim(),
    phone: form.phone.trim(),
    note: form.note.trim(),
    status: 'pending',
    createdAt: Date.now()
  };
  try{
    await bookingsRef.add(booking);
  }catch(e){
    console.error('submit failed', e);
    submitError = 'Não foi possível enviar o pedido. Tenta novamente.';
    render();
    return;
  }
  notifyBarberOfNewBooking(booking);
  submitted = true;
  render();
}

// ---------- render ----------

function render(){
  if(firebaseUnavailable){
    root.innerHTML = '<div class="header"><div class="brand">Marcações indisponíveis</div>'+
      '<div class="tagline" style="margin-top:10px;">Não foi possível ligar à base de dados. Tenta recarregar a página dentro de momentos.</div></div>';
    return;
  }
  if(!data || !configLoaded || !bookingsLoaded){ root.innerHTML = '<div class="loading">A preparar a agenda…</div>'; return; }
  const cfg = data.config;
  let html = '';
  html += '<div class="header">';
  html += '<div class="brandrow"><div><div class="brand">'+esc(cfg.barbershopName)+'</div>';
  html += '<div class="tagline">Estilo com atitude. Marca já o teu horário.</div></div>';
  if(cfg.instagramUrl){
    html += '<a class="insta-link" href="'+esc(cfg.instagramUrl)+'" target="_blank" rel="noopener" aria-label="Instagram">'+
      '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">'+
      '<rect x="2.5" y="2.5" width="19" height="19" rx="5.5" stroke="currentColor" stroke-width="1.8"/>'+
      '<circle cx="12" cy="12" r="4.6" stroke="currentColor" stroke-width="1.8"/>'+
      '<circle cx="17.3" cy="6.7" r="1.15" fill="currentColor"/>'+
      '</svg></a>';
  }
  html += '</div>';
  html += '<div class="stripe"></div></div>';

  html += renderClientView();

  html += '<div class="footer-note">Sem necessidade de criar conta — a confirmação é enviada por email.</div>';
  root.innerHTML = html;
  attachHandlers();
}

function renderClientView(){
  if(submitted){
    return '<div class="card success">'+
      '<div class="mark">✓</div>'+
      '<h2>Pedido enviado</h2>'+
      '<p>O barbeiro vai rever o teu pedido e recebes a confirmação (ou não) por email em breve.</p>'+
      '<button class="btn btn-primary" data-action="new-booking">Fazer outra marcação</button>'+
      '</div>';
  }

  let html = '<div class="card">';
  html += '<div class="section-title">Onde queres cortar?</div>';
  html += '<div class="servicegrid">';
  getAvailableLocations().forEach(loc=>{
    const sel = loc===selectedLocation;
    html += '<div class="service '+(sel?'selected':'')+'" data-action="pick-location" data-loc="'+esc(loc)+'">'+
      '<div class="sname">📍 '+esc(loc)+'</div></div>';
  });
  html += '</div></div>';

  if(!selectedLocation) return html;

  html += '<div class="card">';
  html += '<div class="section-title">Escolhe o serviço</div>';
  html += '<div class="servicegrid">';
  data.config.services.forEach(s=>{
    const sel = s.id===selectedService;
    html += '<div class="service '+(sel?'selected':'')+'" data-action="pick-service" data-id="'+s.id+'">'+
      '<div class="sname">'+esc(s.name)+'</div><div class="sdur">'+formatDuration(s.minutes)+'</div></div>';
  });
  html += '</div></div>';

  if(selectedService){
    const svc = serviceById(selectedService);
    const dates = generateWorkDates(21, selectedLocation);
    html += '<div class="card">';
    html += '<div class="section-title">Escolhe o dia — '+esc(selectedLocation)+'</div>';
    if(dates.length===0){
      html += '<div class="empty-note">Sem dias disponíveis em '+esc(selectedLocation)+' de momento.</div>';
    } else {
      html += '<div class="daylist">';
      dates.forEach(dk=>{
        const [y,m,d] = dk.split('-').map(Number);
        const dt = new Date(y,m-1,d);
        const sel = dk===selectedDate;
        html += '<div class="daychip '+(sel?'selected':'')+'" data-action="pick-date" data-date="'+dk+'">'+
          '<div class="dow">'+DOW[dt.getDay()]+'</div><div class="dnum">'+d+'</div></div>';
      });
      html += '</div>';
    }
    html += '</div>';

    if(selectedDate){
      const slots = generateSlots(selectedDate, svc.minutes);
      html += '<div class="card">';
      html += '<div class="section-title">Horários disponíveis — '+fmtDateLong(selectedDate)+'</div>';
      if(slots.length===0){
        html += '<div class="empty-note">Não há horários livres neste dia para este serviço. Escolhe outro dia.</div>';
      } else {
        html += '<div class="slotgrid">';
        slots.forEach(s=>{
          html += '<div class="slot '+(s===selectedTime?'selected':'')+'" data-action="pick-time" data-time="'+s+'">'+s+'</div>';
        });
        html += '</div>';
      }
      html += '</div>';
    }
  }

  if(selectedService && selectedDate && selectedTime){
    html += '<div class="card">';
    html += '<div class="section-title">Os teus dados</div>';
    html += '<label>Nome</label><input type="text" id="f-name" value="'+esc(form.name)+'" placeholder="O teu nome">';
    html += '<label>Email</label><input type="email" id="f-email" value="'+esc(form.email)+'" placeholder="para receberes a confirmação">';
    html += '<label>Telefone</label><input type="tel" id="f-phone" value="'+esc(form.phone)+'" placeholder="912 345 678">';
    html += '<label>Nota (opcional)</label><textarea id="f-note" placeholder="Ex: também apara a barba">'+esc(form.note)+'</textarea>';
    if(submitError) html += '<div class="error-text">'+esc(submitError)+'</div>';
    const svc = serviceById(selectedService);
    html += '<div style="margin-top:16px;"><button class="btn btn-primary btn-block" data-action="submit">Pedir marcação — '+esc(svc.name)+', '+fmtDateLong(selectedDate)+', '+selectedTime+'</button></div>';
    html += '</div>';
  }
  return html;
}

function attachHandlers(){
  root.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', onAction);
  });
  const inputs = ['f-name','f-email','f-phone','f-note'];
  inputs.forEach(id=>{
    const el = document.getElementById(id);
    if(el){
      el.addEventListener('input', ()=>{
        const map = {'f-name':'name','f-email':'email','f-phone':'phone','f-note':'note'};
        form[map[id]] = el.value;
      });
    }
  });
}

function onAction(e){
  const el = e.currentTarget;
  const action = el.dataset.action;

  if(action==='pick-location'){ selectedLocation = el.dataset.loc; selectedService=null; selectedDate=null; selectedTime=null; render(); return; }
  if(action==='pick-service'){ selectedService = el.dataset.id; selectedDate=null; selectedTime=null; render(); return; }
  if(action==='pick-date'){ selectedDate = el.dataset.date; selectedTime = null; render(); return; }
  if(action==='pick-time'){ selectedTime = el.dataset.time; render(); return; }
  if(action==='submit'){ submitBooking(); return; }
  if(action==='new-booking'){
    submitted=false; selectedLocation=null; selectedService=null; selectedDate=null; selectedTime=null;
    form={name:'',email:'',phone:'',note:''}; submitError=''; render(); return;
  }
}

function initEmailJs(){
  try{
    if(typeof emailjs !== 'undefined' && EMAILJS_PUBLIC_KEY.indexOf('COLA_AQUI')===-1){
      emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
      emailjsReady = true;
    }
  }catch(e){
    console.error('EmailJS init failed', e);
    emailjsReady = false;
  }
}

initEmailJs();
initFirebase();
</script>
